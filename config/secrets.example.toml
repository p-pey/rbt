# Fallback credential store, used only when the OS keyring (Windows Credential Manager) is
# unavailable. Copy to secrets.toml (git-ignored). NEVER commit real values.
# The Settings dialog can also save these for you.

[telegram]
bot_token = "PASTE-BOT-TOKEN-FROM-BOTFATHER"
chat_id = "PASTE-CHAT-ID"      # your user id, a group id (negative), or "@channelname"
