name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "config/**"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,mt5,secrets,build,dev]"

      - name: Lint and type-check
        run: |
          ruff check .
          mypy

      - name: Tests (Qt runs headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build the executable and run its self-check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: XAUAssistant-windows
          path: dist/XAUAssistant-windows.zip
          if-no-files-found: error

      - name: Upload the self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfcheck-report
          path: build/selfcheck-data/logs/selfcheck.txt
          if-no-files-found: ignore
